# 소비전류 바닥값 측정용.
#
#   west build ... -- -DEXTRA_CONF_FILE=power_test.conf
#
# CLI/USB/LED 를 모두 빼고 부팅 3초 뒤 System OFF 로 들어간다.
# 이때 측정되는 값이 보드(LDO 정지전류, 표시 LED, VBAT 분압) 만의 소비다.
#
CONFIG_APP_USE_CLI=n
CONFIG_APP_USE_HEARTBEAT_LED=n
CONFIG_APP_POWER_TEST=y

CONFIG_DEBUG_OPTIMIZATIONS=n
CONFIG_DEBUG_THREAD_INFO=n
CONFIG_SIZE_OPTIMIZATIONS=y
