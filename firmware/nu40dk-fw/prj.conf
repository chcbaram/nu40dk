CONFIG_GPIO=y

# CLI 용 UART (uart0, P0.06 TX / P0.08 RX)
#
CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y

# sys_reboot() (resetToBoot / resetToReset)
#
CONFIG_REBOOT=y

# 디버깅용. 릴리즈 빌드에서는 제거한다.
#   DEBUG_OPTIMIZATIONS  : -Og 로 빌드해서 브레이크포인트/변수 확인이 정상 동작
#   DEBUG_THREAD_INFO    : 디버거의 스레드 인식(pyOCD/cortex-debug)
#
CONFIG_DEBUG_OPTIMIZATIONS=y
CONFIG_DEBUG_THREAD_INFO=y
