CONFIG_GPIO=y

# CLI(USB CDC)는 Kconfig 의 APP_USE_CLI 로 제어한다.
# 끄려면 CONFIG_APP_USE_CLI=n (또는 low_power.conf 사용).
#
CONFIG_APP_USE_CLI=y

# sys_reboot() (resetToBoot / resetToReset)
#
CONFIG_REBOOT=y

# 디버깅용. 릴리즈 빌드에서는 제거한다.
#   DEBUG_OPTIMIZATIONS  : -Og 로 빌드해서 브레이크포인트/변수 확인이 정상 동작
#   DEBUG_THREAD_INFO    : 디버거의 스레드 인식(pyOCD/cortex-debug)
#
CONFIG_DEBUG_OPTIMIZATIONS=y
CONFIG_DEBUG_THREAD_INFO=y
